[package]
name = "yk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yinkote HTTP API server and workbench host"

[[bin]]
name = "yinkote"
path = "src/main.rs"

[dependencies]
yk-agent = { path = "../yk-agent" }
yk-import = { path = "../yk-import" }
yk-core.workspace = true
yk-ai.workspace = true
yk-store.workspace = true
yk-search.workspace = true
yk-plugin.workspace = true
yk-scrape.workspace = true
yk-cite.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
toml.workspace = true
reqwest.workspace = true
rand.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
parking_lot.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rust-embed = { version = "8.12.0", default-features = false, features = ["interpolate-folder-path"] }
mime_guess = "2.0.5"

[dev-dependencies]
rusqlite = { workspace = true }
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
