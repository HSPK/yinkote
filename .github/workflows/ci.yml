# The four gates, on every change.
#
# The same four the project runs by hand, in the same order, read by exit code:
# a suite that reports "593 passed" while returning non-zero has still failed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm test

  smoke:
    # Against a real server with a real library, because the things this
    # catches — a route that does not exist, a field the client reads and the
    # server never sends — are invisible to both suites above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci && npm run build

      - run: cargo build --release --locked -p yk-server

      - name: Start it
        run: |
          ./target/release/yinkote --data-dir "$RUNNER_TEMP/library" &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:23130/api/v1/ping > /dev/null && exit 0
            sleep 1
          done
          echo "the server never came up"; exit 1

      - run: bash scripts/smoke.sh
